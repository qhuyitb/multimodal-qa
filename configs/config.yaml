# Main configuration file

# Language Detection Configuration
language_detection:
  # Method for text-based detection: "auto", "langdetect", "fasttext"
  text_method: "auto"
  
  # Minimum confidence threshold (0.0-1.0)
  min_confidence: 0.7
  
  # Sample size for document detection (characters)
  document_sample_size: 5000
  
  # Audio sample duration for Whisper detection (seconds)
  audio_sample_duration: 30

# Translation Configuration
translation:
  # Enable/disable translation service
  enabled: true
  
  # Default behavior - do not translate unless requested
  auto_translate: false
  
  # Device for translation models: "cpu" or "cuda"
  device: "cpu"
  
  # Maximum sequence length for translation
  max_length: 512
  
  # Batch size for batch translation
  batch_size: 8
  
  # Cache directory for translation models
  cache_dir: null  # null = use default (~/.cache/huggingface)
  
  # Supported language pairs (Helsinki-NLP models)
  supported_languages:
    - en  # English
    - vi  # Vietnamese
    - zh  # Chinese
    - ja  # Japanese
    - ko  # Korean
    - fr  # French
    - de  # German
    - es  # Spanish
  
  # Enable pivot translation through English
  enable_pivot: true

# Cross-Language QA Configuration
cross_language_qa:
  # Enable cross-language queries (query lang != source lang)
  enabled: true
  
  # Multilingual embedding model for cross-language retrieval
  embedding_model: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
  
  # Translation layer: "output" (translate answer) or "input" (translate query)
  translation_layer: "output"
  
  # Whether to return both original and translated answers
  return_both: false

# Subtitle Generation Configuration
subtitles:
  # Default subtitle formats to generate
  formats:
    - "srt"
    - "vtt"
  
  # Maximum characters per subtitle line
  max_chars_per_line: 42
  
  # Maximum lines per subtitle
  max_lines: 2
  
  # Generate dual-language subtitles by default
  generate_dual_language: false

# Document Processing Configuration
documents:
  # Default behavior for document indexing
  index_original: true
  index_translation: false
  
  # Generate translated document files
  generate_translated: false
  
  # Generate dual-language documents
  generate_dual_language: false
  
  # Chunk size for translation (characters)
  translation_chunk_size: 2000

# Model Paths
models:
  whisper:
    model_name: "base"
    device: "cpu"
  
  translation:
    # Inherits from translation config above
    pass
  
  embedding:
    model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
    device: "cpu"

# Storage Paths
paths:
  data_dir: "data"
  input_dir: "data/input"
  output_dir: "data/output"
  vector_db: "data/vector_db"
  
  # Language-specific output directories
  subtitles:
    srt: "data/output/subtitles/srt"
    vtt: "data/output/subtitles/vtt"
  
  translations:
    documents: "data/output/translations"
    subtitles: "data/output/translations/subtitles"

# Data Augmentation Configuration
data_augmentation:
  # Enable data augmentation
  enabled: false
  
  # Augmentation methods: synonym, back_translation
  methods:
    - "synonym"
    - "back_translation"
  
  # Number of augmentations per example
  num_augmentations: 2
  
  # Augment train split only
  train_only: true
  
  # Maximum training examples to augment (null = all)
  max_train_examples: null
  
  # Device for translation-based augmentation
  device: "cpu"
  
  # Back-translation intermediate language
  back_translation_lang: "en"
  
  # Synonym replacement config
  synonym_replacement:
    num_replacements: 2
    preserve_entities: true

# Fine-tuning Configuration
fine_tuning:
  # QA Model (XLM-RoBERTa)
  qa_model:
    base_model: "xlm-roberta-base"
    use_lora: true
    lora_r: 16
    lora_alpha: 32
    target_modules: ["query", "value", "key"]
    
    # Stage 1: EN warm-up
    stage1:
      learning_rate: 2e-5
      batch_size: 8
      epochs: 1
      warmup_ratio: 0.1
      max_length: 384
      doc_stride: 128
    
    # Stage 2: VI fine-tune
    stage2:
      learning_rate: 3e-5
      batch_size: 8
      epochs: 3
      warmup_ratio: 0.1
      max_length: 384
      doc_stride: 128
  
  # Translation Model (Helsinki-NLP)
  translation_model:
    base_model: "Helsinki-NLP/opus-mt-en-vi"
    learning_rate: 3e-5
    batch_size: 8
    epochs: 3
    warmup_steps: 500
    max_length: 512
    save_steps: 500
    eval_steps: 500

# Evaluation Configuration
evaluation:
  # Enable evaluation metrics
  enabled: true
  
  # Metrics to compute
  compute_translation_quality: true
  compute_latency_overhead: true
  compute_qa_correctness: true
  
  # Reference translations path (for BLEU scoring)
  reference_translations_dir: null
